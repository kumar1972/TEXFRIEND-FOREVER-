name: Build Windows Setup

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Electron & Builder
        run: npm install --save-dev electron electron-builder

      - name: Create Electron Main File
        run: |
          $mainJs = @'
          const { app, BrowserWindow, Menu } = require("electron");
          const path = require("path");
          const isDev = require("electron-is-dev");

          let mainWindow;

          function createWindow() {
            mainWindow = new BrowserWindow({
              width: 1400,
              height: 900,
              minWidth: 800,
              minHeight: 600,
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true,
                preload: path.join(__dirname, "preload.js")
              },
              icon: path.join(__dirname, "assets/icon.ico")
            });

            const startUrl = isDev
              ? "http://localhost:3000"
              : `file://$${path.join(__dirname, "../build/index.html")}`;

            mainWindow.loadFile(path.join(__dirname, "index.html"));

            if (isDev) {
              mainWindow.webContents.openDevTools();
            }

            mainWindow.on("closed", () => {
              mainWindow = null;
            });
          }

          app.on("ready", createWindow);

          app.on("window-all-closed", () => {
            if (process.platform !== "darwin") {
              app.quit();
            }
          });

          app.on("activate", () => {
            if (mainWindow === null) {
              createWindow();
            }
          });

          const menu = Menu.buildFromTemplate([
            {
              label: "File",
              submenu: [
                {
                  label: "Exit",
                  accelerator: "CmdOrCtrl+Q",
                  click: () => {
                    app.quit();
                  }
                }
              ]
            },
            {
              label: "Edit",
              submenu: [
                { role: "undo" },
                { role: "redo" },
                { type: "separator" },
                { role: "cut" },
                { role: "copy" },
                { role: "paste" }
              ]
            }
          ]);

          Menu.setApplicationMenu(menu);
          '@'
          
          Set-Content -Path "main.js" -Value $mainJs

      - name: Create Preload File
        run: |
          $preloadJs = @'
          const { contextBridge } = require("electron");

          contextBridge.exposeInMainWorld("electron", {
            version: () => process.version
          });
          '@'
          
          Set-Content -Path "preload.js" -Value $preloadJs

      - name: Update package.json for Electron
        run: |
          $packageJson = Get-Content "package.json" | ConvertFrom-Json
          
          $packageJson.main = "main.js"
          $packageJson.homepage = "./"
          
          if (-not $packageJson.build) {
            $packageJson | Add-Member -NotePropertyName build -NotePropertyValue @{}
          }
          
          $packageJson.build.appId = "com.kumar.texforever"
          $packageJson.build.productName = "TEXFRIEND TEXFOREVER"
          $packageJson.build.directories = @{ buildResources = "assets" }
          $packageJson.build.files = @(
            "index.html",
            "css/**/*",
            "js/**/*",
            "assets/**/*",
            "main.js",
            "preload.js",
            "node_modules/**/*"
          )
          
          $packageJson.build.win = @{
            target = @(
              @{ target = "nsis"; arch = @("x64") },
              @{ target = "portable"; arch = @("x64") }
            )
          }
          
          $packageJson.build.nsis = @{
            oneClick = $false
            allowToChangeInstallationDirectory = $true
            createDesktopShortcut = $true
            createStartMenuShortcut = $true
            shortcutName = "TEXFRIEND TEXFOREVER"
            installerIcon = "assets/icon.ico"
            uninstallerIcon = "assets/icon.ico"
          }
          
          if (-not $packageJson.scripts) {
            $packageJson | Add-Member -NotePropertyName scripts -NotePropertyValue @{}
          }
          
          $packageJson.scripts.start = "electron ."
          $packageJson.scripts.'build-windows' = "electron-builder --win"
          $packageJson.scripts.'build-windows-installer' = "electron-builder --win nsis"
          
          $packageJson | ConvertTo-Json -Depth 10 | Set-Content "package.json"

      - name: Verify Windows Build Setup
        run: |
          echo "===== PROJECT FILES ====="
          Get-ChildItem -Path "." -Depth 1
          echo "========================="
          
          echo ""
          echo "===== MAIN.JS ====="
          if (Test-Path "main.js") {
            echo "✓ main.js exists"
          } else {
            echo "✗ main.js missing"
          }
          echo "===================="
          
          echo ""
          echo "===== INDEX.HTML ====="
          if (Test-Path "index.html") {
            echo "✓ index.html exists"
          } else {
            echo "✗ index.html missing"
          }
          echo "====================="
          
          echo ""
          echo "===== PACKAGE.JSON BUILD CONFIG ====="
          $packageJson = Get-Content "package.json" | ConvertFrom-Json
          if ($packageJson.build) {
            echo "✓ Build config exists"
            echo "  productName: $($packageJson.build.productName)"
            echo "  appId: $($packageJson.build.appId)"
          } else {
            echo "✗ Build config missing"
          }
          echo "====================================="

      - name: Build Windows Installer
        run: |
          npm run build-windows-installer

      - name: Check Build Output
        run: |
          echo "===== BUILD OUTPUT ====="
          if (Test-Path "dist") {
            Get-ChildItem -Path "dist" -Recurse
          } else {
            echo "✗ dist folder not found"
          }
          echo "========================"

      - name: Rename EXE
        run: |
          $exeFiles = Get-ChildItem -Path "dist" -Filter "*.exe" -Recurse
          
          foreach ($file in $exeFiles) {
            $newName = Join-Path $file.Directory.FullName "TEXFRIEND TEXFOREVER Setup.exe"
            Rename-Item -Path $file.FullName -NewName $newName
            echo "Renamed to: $newName"
          }

      - name: Upload Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist/**/*.exe
          if-no-files-found: error

      - name: Create Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
