name: Build Windows Setup

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Electron & Builder
        run: npm install --save-dev electron electron-builder

      - name: Create Electron Main File
        shell: pwsh
        run: |
          $mainJs = @"
          const { app, BrowserWindow, Menu } = require('electron');
          const path = require('path');

          let mainWindow;

          function createWindow() {
            mainWindow = new BrowserWindow({
              width: 1400,
              height: 900,
              minWidth: 800,
              minHeight: 600,
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true
              },
              icon: path.join(__dirname, 'assets/icon.ico')
            });

            mainWindow.loadFile(path.join(__dirname, 'index.html'));

            mainWindow.on('closed', () => {
              mainWindow = null;
            });
          }

          app.on('ready', createWindow);

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') {
              app.quit();
            }
          });

          app.on('activate', () => {
            if (mainWindow === null) {
              createWindow();
            }
          });

          const menu = Menu.buildFromTemplate([
            {
              label: 'File',
              submenu: [
                {
                  label: 'Exit',
                  accelerator: 'CmdOrCtrl+Q',
                  click: () => { app.quit(); }
                }
              ]
            }
          ]);

          Menu.setApplicationMenu(menu);
          "@

          Set-Content -Path "main.js" -Value $mainJs
          Write-Host "main.js created successfully"

      - name: Create Preload File
        shell: pwsh
        run: |
          $preloadJs = @"
          const { contextBridge } = require('electron');

          contextBridge.exposeInMainWorld('electron', {
            version: () => process.version
          });
          "@

          Set-Content -Path "preload.js" -Value $preloadJs
          Write-Host "preload.js created successfully"

      - name: Update package.json
        shell: pwsh
        run: |
          `$packageJson = Get-Content "package.json" -Raw | ConvertFrom-Json
          
          `$packageJson.main = "main.js"
          `$packageJson.homepage = "./"
          
          `$build = @{
            appId = "com.kumar.texforever"
            productName = "TEXFRIEND TEXFOREVER"
            directories = @{ buildResources = "assets" }
            files = @(
              "index.html",
              "css/**/*",
              "js/**/*",
              "assets/**/*",
              "main.js",
              "preload.js",
              "node_modules/**/*"
            )
            win = @{
              target = @(
                @{ target = "nsis"; arch = @("x64") },
                @{ target = "portable"; arch = @("x64") }
              )
            }
            nsis = @{
              oneClick = `$false
              allowToChangeInstallationDirectory = `$true
              createDesktopShortcut = `$true
              createStartMenuShortcut = `$true
              shortcutName = "TEXFRIEND TEXFOREVER"
            }
          }
          
          `$packageJson | Add-Member -NotePropertyName build -NotePropertyValue `$build -Force
          
          if (-not `$packageJson.scripts) {
            `$packageJson | Add-Member -NotePropertyName scripts -NotePropertyValue @{}
          }
          
          `$packageJson.scripts.start = "electron ."
          `$packageJson.scripts."build-windows" = "electron-builder --win"
          `$packageJson.scripts."build-windows-installer" = "electron-builder --win nsis"
          
          `$packageJson | ConvertTo-Json -Depth 10 | Set-Content "package.json"
          Write-Host "package.json updated"

      - name: Verify Setup
        shell: pwsh
        run: |
          Write-Host "===== Project Files ====="
          Get-ChildItem -Path "." -Depth 1 | ForEach-Object { Write-Host $_.Name }
          
          Write-Host "`n===== Checking Files ====="
          if (Test-Path "main.js") { Write-Host "✓ main.js exists" } else { Write-Host "✗ main.js missing" }
          if (Test-Path "index.html") { Write-Host "✓ index.html exists" } else { Write-Host "✗ index.html missing" }
          if (Test-Path "package.json") { Write-Host "✓ package.json exists" } else { Write-Host "✗ package.json missing" }

      - name: Build Windows Installer
        run: npm run build-windows-installer

      - name: Rename EXE
        shell: pwsh
        run: |
          $exeFiles = Get-ChildItem -Path "dist" -Filter "*.exe" -Recurse
          
          foreach ($file in $exeFiles) {
            $newName = Join-Path $file.Directory.FullName "TEXFRIEND TEXFOREVER Setup.exe"
            Rename-Item -Path $file.FullName -NewName $newName -Force
            Write-Host "Renamed: $newName"
          }

      - name: Upload Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist/**/*.exe
          if-no-files-found: error

      - name: Create Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
