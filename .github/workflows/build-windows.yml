
name: Build Windows EXE

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
    
      - name: Install dependencies
        run: npm install

      - name: Install Electron & Builder
        run: npm install --save-dev electron electron-builder

      - name: Verify Setup
        shell: pwsh
        run: |
          Write-Host "===== Checking Files ====="

          if (Test-Path "main.js") {
            Write-Host "main.js exists"
          } else {
            throw "main.js missing"
          }

          if (Test-Path "preload.js") {
            Write-Host "preload.js exists"
          } else {
            throw "preload.js missing"
          }

          if (Test-Path "index.html") {
            Write-Host "index.html exists"
          } else {
            throw "index.html missing"
          }

          if (Test-Path "package.json") {
            Write-Host "package.json exists"
          } else {
            throw "package.json missing"
          }

      - name: Build Windows Installer
        run: npm run build

      - name: Rename EXE
        shell: pwsh
        run: |
          $exeFiles = Get-ChildItem -Path "dist" -Filter "*.exe" -Recurse

          if ($exeFiles.Count -eq 0) {
            throw "No EXE file found in dist folder"
          }

          foreach ($file in $exeFiles) {
            $newName = Join-Path $file.Directory.FullName "TEXFOREVER Setup.exe"

            if ($file.FullName -ne $newName) {
              Rename-Item -Path $file.FullName -NewName "TEXFOREVER Setup.exe" -Force
            }

            Write-Host "Created: $newName"
          }

      - name: Upload Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: TEXFOREVER-Windows
          path: dist/**/*.exe
          if-no-files-found: error

      - name: Create Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
