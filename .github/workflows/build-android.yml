name: Build Android APK

on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create package.json
        run: |
          if [ ! -f package.json ]; then
          npm init -y
          fi

      - name: Install Capacitor Assets
        run: npm install @capacitor/assets --save-dev

      - name: Generate Android Icons
        run: npx capacitor-assets generate --android

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Create www folder
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            echo "<html><body><h1>TEXFOREVER</h1></body></html>" > www/index.html
          fi

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      # **INGE THAAN UPLOAD ARTIFACT STEP VARAVENDUM:**
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
