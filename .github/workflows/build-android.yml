name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ apk-build ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create www folder and copy web files
        run: |
          mkdir -p www
          shopt -s extglob
          cp -r !(www|android|node_modules|.git|.github) www/ 2>/dev/null || true

      - name: Remove old capacitor config if exists
        run: rm -f capacitor.config.json capacitor.config.ts

      - name: Init Capacitor
        run: npx cap init "Texfriend Forever" com.kumar.texfriendforever --web-dir=www

      - name: Add Android platform
        run: npx cap add android

      - name: DEBUG - Find Java version references
        run: |
          echo "=== Searching for VERSION_21 ==="
          grep -rn "VERSION_21" android/ 2>/dev/null || echo "None found in android/"
          echo "=== Searching for sourceCompatibility ==="
          grep -rn "sourceCompatibility" android/ 2>/dev/null || echo "None found"
          echo "=== app/build.gradle content ==="
          cat android/app/build.gradle
