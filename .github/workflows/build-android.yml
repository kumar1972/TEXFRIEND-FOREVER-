name: Build Android APK

on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create www folder and copy web files
        run: |
          mkdir -p www
          shopt -s extglob
          cp -r !(www|android|node_modules|.git|.github) www/ 2>/dev/null || true

      - name: Remove old capacitor config if exists
        run: rm -f capacitor.config.json capacitor.config.ts

      - name: Init Capacitor
        run: npx cap init "Texfriend Forever" com.kumar.texfriendforever --web-dir=www

      - name: Add Android platform
        run: npx cap add android

      - name: Sync
        run: npx cap sync android

      - name: DEBUG - Find Java version references
        run: |
          echo "=== app/build.gradle content ==="
          cat android/app/build.gradle
          echo "=== variables.gradle content ==="
          cat android/variables.gradle

      - name: Configure Java 17
        run: |
          cat >> android/build.gradle <<'EOF'

           subprojects {
          tasks.withType(JavaCompile).configureEach {
               options.release.set(17)
             }
          }
      EOF

       - name: Build APK
           run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
