name: Build Android APK

on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create package.json
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
       - name: Install Capacitor Assets
        run: npm install @capacitor/assets --save-dev

      - name: Generate Android Icons
        run: npx capacitor-assets generate --android

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Create www folder
        run: |
          mkdir -p www

      - name: Copy web files to www
        shell: bash
        run: |
          find . -maxdepth 1 \
            ! -name "." \
            ! -name "./www" \
            ! -name "./android" \
            ! -name "./node_modules" \
            ! -name "./.git" \
            ! -name "./.github" \
            -exec cp -r {} www/ \;

      - name: Remove old Capacitor config
        run: |
          rm -f capacitor.config.json
          rm -f capacitor.config.ts

      - name: Initialize Capacitor
        run: |
          npx cap init "TEXFRIEND FOREVER" com.kumar.texfriendforever --web-dir=www

      - name: Add Android platform
        run: |
          npx cap add android

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEXFRIEND FOREVER-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
