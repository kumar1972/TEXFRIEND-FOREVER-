name: Build Android APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare www
        run: |
          mkdir -p www
          rm -rf www/*

          for item in *.html *.js *.css assets images Data config; do
            if [ -e "$item" ]; then
              cp -r "$item" www/
            fi
          done

      - name: Init Capacitor
        run: |
          rm -f capacitor.config.json
          rm -f capacitor.config.ts
          npx cap init "Texforever" com.kumar.texforever --web-dir=www

      - name: Add Android
        run: |
          npx cap add android

      - name: Create storage plugin
        run: |
          mkdir -p android/app/src/main/java/com/kumar/texforever

          cat > android/app/src/main/java/com/kumar/texforever/TexforeverStoragePlugin.java <<'EOF'
          package com.kumar.texforever;

          import android.content.Intent;
          import android.net.Uri;
          import android.provider.DocumentsContract;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.io.OutputStream;

          @CapacitorPlugin(name = "TexforeverStorage")
          public class TexforeverStoragePlugin extends Plugin {

              @PluginMethod
              public void selectFolder(PluginCall call) {

                  Intent intent =
                      new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);

                  intent.addFlags(
                      Intent.FLAG_GRANT_READ_URI_PERMISSION |
                      Intent.FLAG_GRANT_WRITE_URI_PERMISSION |
                      Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION |
                      Intent.FLAG_GRANT_PREFIX_URI_PERMISSION
                  );

                  startActivityForResult(
                      call,
                      intent,
                      "folderPickerResult"
                  );
              }

              @ActivityCallback
              private void folderPickerResult(
                      PluginCall call,
                      ActivityResult result) {

                  if (result == null ||
                      result.getData() == null) {

                      call.reject(
                          "Folder selection cancelled"
                      );

                      return;
                  }

                  Intent data = result.getData();

                  Uri uri = data.getData();

                  if (uri == null) {

                      call.reject(
                          "Selected folder URI is empty"
                      );

                      return;
                  }

                  try {

                      int flags =
                          data.getFlags() &
                          (
                              Intent.FLAG_GRANT_READ_URI_PERMISSION |
                              Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                          );

                      getContext()
                          .getContentResolver()
                          .takePersistableUriPermission(
                              uri,
                              flags
                          );

                  } catch (Exception ignored) {
                  }

                  JSObject resultData =
                      new JSObject();

                  resultData.put(
                      "uri",
                      uri.toString()
                  );

                  resultData.put(
                      "name",
                      "Selected Folder"
                  );

                  call.resolve(resultData);
              }

              @PluginMethod
              public void saveBackup(PluginCall call) {

                  String fileName =
                      call.getString("fileName");

                  String base64Data =
                      call.getString("data");

                  String folderUri =
                      call.getString("folderUri");

                  if (
                      fileName == null ||
                      base64Data == null ||
                      folderUri == null
                  ) {

                      call.reject(
                          "Missing backup data or folder"
                      );

                      return;
                  }

                  try {

                      Uri fileUri =
                          DocumentsContract.createDocument(
                              getContext()
                                  .getContentResolver(),
                              Uri.parse(folderUri),
                              "application/json",
                              fileName
                          );

                      if (fileUri == null) {

                          call.reject(
                              "Unable to create backup file"
                          );

                          return;
                      }

                      byte[] bytes =
                          android.util.Base64.decode(
                              base64Data,
                              android.util.Base64.DEFAULT
                          );

                      OutputStream output =
                          getContext()
                              .getContentResolver()
                              .openOutputStream(
                                  fileUri
                              );

                      if (output == null) {

                          call.reject(
                              "Unable to open selected folder"
                          );

                          return;
                      }

                      output.write(bytes);
                      output.flush();
                      output.close();

                      JSObject response =
                          new JSObject();

                      response.put(
                          "success",
                          true
                      );

                      response.put(
                          "fileName",
                          fileName
                      );

                      response.put(
                          "uri",
                          fileUri.toString()
                      );

                      call.resolve(response);

                  } catch (Exception e) {

                      call.reject(
                          "Backup save failed: " +
                          (
                              e.getMessage() != null
                                  ? e.getMessage()
                                  : "Unknown error"
                          )
                      );
                  }
              }
          }
          EOF

      - name: Create MainActivity
        run: |
          cat > android/app/src/main/java/com/kumar/texforever/MainActivity.java <<'EOF'
          package com.kumar.texforever;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {

                  registerPlugin(
                      TexforeverStoragePlugin.class
                  );

                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: Java compatibility
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }
          }
          EOF

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
