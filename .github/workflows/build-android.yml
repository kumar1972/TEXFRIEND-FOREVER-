name: Build Android APK

on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare www folder
        shell: bash
        run: |
          echo "=== Preparing www folder ==="

          mkdir -p www
          rm -rf www/*

          for item in *.html *.js *.css assets images Data config; do
            if [ -e "$item" ]; then
              cp -r "$item" www/
            fi
          done

          echo "=== www contents ==="
          find www -maxdepth 2 -type f | sort

      - name: Remove old Capacitor config
        run: |
          rm -f capacitor.config.json
          rm -f capacitor.config.ts

      - name: Init Capacitor
        run: |
          npx cap init "Texforever" com.kumar.texforever --web-dir=www

      - name: Add Android platform
        run: |
          npx cap add android

      - name: Create native folder picker plugin
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/kumar/texforever

          cat > android/app/src/main/java/com/kumar/texforever/TexforeverStoragePlugin.java <<'EOF'
          package com.kumar.texforever;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.provider.DocumentsContract;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.io.OutputStream;
          import java.util.Base64;

          @CapacitorPlugin(name = "TexforeverStorage")
          public class TexforeverStoragePlugin extends Plugin {

              private PluginCall pendingFolderCall;

              @PluginMethod
              public void selectFolder(PluginCall call) {

                  pendingFolderCall = call;

                  Intent intent =
                      new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);

                  intent.addFlags(
                      Intent.FLAG_GRANT_READ_URI_PERMISSION |
                      Intent.FLAG_GRANT_WRITE_URI_PERMISSION |
                      Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION |
                      Intent.FLAG_GRANT_PREFIX_URI_PERMISSION
                  );

                  startActivityForResult(
                      call,
                      intent,
                      "folderPickerResult"
                  );
              }

              @Override
              protected void handleOnActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.handleOnActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );

                  PluginCall call = pendingFolderCall;
                  pendingFolderCall = null;

                  if (call == null) {
                      return;
                  }

                  if (resultCode != Activity.RESULT_OK ||
                      data == null) {

                      call.reject(
                          "Folder selection cancelled"
                      );

                      return;
                  }

                  Uri uri = data.getData();

                  if (uri == null) {

                      call.reject(
                          "Selected folder URI is empty"
                      );

                      return;
                  }

                  try {

                      final int takeFlags =
                          data.getFlags() &
                          (
                              Intent.FLAG_GRANT_READ_URI_PERMISSION |
                              Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                          );

                      getContext()
                          .getContentResolver()
                          .takePersistableUriPermission(
                              uri,
                              takeFlags
                          );

                  } catch (Exception ignored) {
                  }

                  JSObject result =
                      new JSObject();

                  result.put(
                      "uri",
                      uri.toString()
                  );

                  result.put(
                      "name",
                      getFolderName(uri)
                  );

                  call.resolve(result);
              }

              private String getFolderName(Uri uri) {

                  try {

                      String path =
                          uri.getPath();

                      if (path != null) {

                          int index =
                              path.lastIndexOf(':');

                          if (
                              index >= 0 &&
                              index < path.length() - 1
                          ) {

                              return path.substring(
                                  index + 1
                              );
                          }
                      }

                  } catch (Exception ignored) {
                  }

                  return "Selected Folder";
              }

              @PluginMethod
              public void saveBackup(
                      PluginCall call) {

                  String fileName =
                      call.getString("fileName");

                  String base64Data =
                      call.getString("data");

                  String folderUriString =
                      call.getString("folderUri");

                  if (
                      fileName == null ||
                      base64Data == null ||
                      folderUriString == null
                  ) {

                      call.reject(
                          "Missing backup data or folder"
                      );

                      return;
                  }

                  try {

                      Uri treeUri =
                          Uri.parse(folderUriString);

                      Uri fileUri =
                          DocumentsContract.createDocument(
                              getContext()
                                  .getContentResolver(),
                              treeUri,
                              "application/json",
                              fileName
                          );

                      if (fileUri == null) {

                          call.reject(
                              "Unable to create backup file"
                          );

                          return;
                      }

                      byte[] bytes;

                      if (
                          android.os.Build.VERSION.SDK_INT >= 26
                      ) {

                          bytes =
                              Base64.getDecoder()
                                  .decode(base64Data);

                      } else {

                          bytes =
                              android.util.Base64.decode(
                                  base64Data,
                                  android.util.Base64.DEFAULT
                              );
                      }

                      try (
                          OutputStream output =
                              getContext()
                                  .getContentResolver()
                                  .openOutputStream(
                                      fileUri
                                  )
                      ) {

                          if (output == null) {

                              call.reject(
                                  "Unable to open selected folder"
                              );

                              return;
                          }

                          output.write(bytes);
                          output.flush();
                      }

                      JSObject result =
                          new JSObject();

                      result.put(
                          "success",
                          true
                      );

                      result.put(
                          "fileName",
                          fileName
                      );

                      result.put(
                          "uri",
                          fileUri.toString()
                      );

                      call.resolve(result);

                  } catch (Exception e) {

                      call.reject(
                          "Backup save failed: " +
                          (
                              e.getMessage() != null
                                  ? e.getMessage()
                                  : "Unknown error"
                          )
                      );
                  }
              }
          }
          EOF

      - name: Register native plugin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "android/app/src/main/java/com/kumar/texforever/MainActivity.java"
          )

          s = p.read_text()

          if "TexforeverStoragePlugin" not in s:

              s = s.replace(
                  "import com.getcapacitor.BridgeActivity;",
                  "import com.getcapacitor.BridgeActivity;\n"
                  "import com.kumar.texforever.TexforeverStoragePlugin;"
              )

              s = s.replace(
                  "public class MainActivity extends BridgeActivity {",
                  """public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(
                      android.os.Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  registerPlugin(
                      TexforeverStoragePlugin.class
                  );
              }
          }"""
              )

              p.write_text(s)

          print(p.read_text())
          PY

      - name: Sync Capac
