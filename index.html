<!DOCTYPE html>
<html lang="ta">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#030705">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<meta name="apple-mobile-web-app-title"
      content="TEXFRIEND FOREVER">

<meta name="application-name"
      content="TEXFRIEND FOREVER">

<title>TEXFRIEND FOREVER - Premium Portal</title>

<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="icon-192.png">

<script src="config.js"></script>
<script src="translator.js"></script>


    <style>

        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {

            width: 100%;
            min-height: 100vh;

            background: #030705;

            background-image:

                radial-gradient(
                    circle at 15% 15%,
                    rgba(74, 124, 89, 0.35) 0%,
                    transparent 45%
                ),

                radial-gradient(
                    circle at 85% 85%,
                    rgba(20, 35, 25, 0.8) 0%,
                    transparent 55%
                ),

                linear-gradient(
                    135deg,
                    #030705 0%,
                    #0B130F 100%
                );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            overflow-x: hidden;
        }


        /* =====================================================
           OFFLINE STATUS
        ===================================================== */

        #offlineStatus {

            position: fixed;

            top: 12px;

            left: 50%;

            transform: translateX(-50%);

            z-index: 999999;

            padding: 8px 16px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: 800;

            letter-spacing: 0.3px;

            display: none;

            backdrop-filter: blur(10px);

            -webkit-backdrop-filter: blur(10px);

            box-shadow:
                0 6px 20px rgba(0,0,0,0.35);
        }


        #offlineStatus.offline {

            display: block;

            color: #FFFFFF;

            background:
                rgba(220, 38, 38, 0.92);

            border:
                1px solid rgba(255,255,255,0.2);
        }


        #offlineStatus.online {

            display: block;

            color: #FFFFFF;

            background:
                rgba(16, 185, 129, 0.92);

            border:
                1px solid rgba(255,255,255,0.2);
        }


        /* =====================================================
           MULTI COLOR GLOW
        ===================================================== */

        @keyframes multiColorGlow {

            0% {

                box-shadow:
                    0 0 25px rgba(56, 189, 248, 0.5),
                    0 0 50px rgba(56, 189, 248, 0.2);

                border-color: #38BDF8;
            }

            33% {

                box-shadow:
                    0 0 25px rgba(168, 85, 247, 0.5),
                    0 0 50px rgba(168, 85, 247, 0.2);

                border-color: #A855F7;
            }

            66% {

                box-shadow:
                    0 0 25px rgba(236, 72, 153, 0.5),
                    0 0 50px rgba(236, 72, 153, 0.2);

                border-color: #EC4899;
            }

            100% {

                box-shadow:
                    0 0 25px rgba(56, 189, 248, 0.5),
                    0 0 50px rgba(56, 189, 248, 0.2);

                border-color: #38BDF8;
            }
        }


        /* =====================================================
           AMBIENT BACKGROUND ORBS
        ===================================================== */

        .ambient-orb {

            position: fixed;

            border-radius: 50%;

            filter: blur(70px);

            pointer-events: none;

            z-index: 0;

            opacity: 0.55;
        }

        .ambient-orb.orb-1 {

            width: 320px;
            height: 320px;
            top: -80px;
            left: -80px;
            background: radial-gradient(circle, rgba(56,189,248,0.55), transparent 70%);
            animation: floatOrb 9s ease-in-out infinite alternate;
        }

        .ambient-orb.orb-2 {

            width: 360px;
            height: 360px;
            bottom: -100px;
            right: -100px;
            background: radial-gradient(circle, rgba(168,85,247,0.5), transparent 70%);
            animation: floatOrb 11s ease-in-out infinite alternate-reverse;
        }

        .ambient-orb.orb-3 {

            width: 260px;
            height: 260px;
            top: 40%;
            left: 60%;
            background: radial-gradient(circle, rgba(236,72,153,0.4), transparent 70%);
            animation: floatOrb 13s ease-in-out infinite alternate;
        }

        @keyframes floatOrb {

            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(30px, 25px) scale(1.12);
            }
        }

        @keyframes shimmerText {

            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        /* =====================================================
           LOGIN CARD
        ===================================================== */

        .login-card {

            position: relative;

            z-index: 1;

            width: 100%;

            max-width: 480px;

            min-width: 320px;

            background:
                rgba(14, 24, 18, 0.85);

            backdrop-filter: blur(30px);

            -webkit-backdrop-filter: blur(30px);

            border-radius: 32px;

            padding: 40px 32px;

            border:
                1.5px solid rgba(82, 110, 81, 0.6);

            display: flex;

            flex-direction: column;

            gap: 22px;

            animation:
                multiColorGlow 6s infinite alternate,
                scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .login-card::before {

            content: "";

            position: absolute;

            inset: -2px;

            border-radius: 34px;

            padding: 2px;

            background: linear-gradient(120deg, #38BDF8, #A855F7, #EC4899, #38BDF8);

            background-size: 300% 300%;

            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);

            -webkit-mask-composite: xor;

            mask-composite: exclude;

            opacity: 0.35;

            animation: shimmerBorder 6s linear infinite;

            pointer-events: none;

            z-index: -1;
        }

        @keyframes shimmerBorder {

            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }


        @keyframes scaleIn {

            from {

                opacity: 0;

                transform:
                    translateY(15px)
                    scale(0.97);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo-area {
            text-align: center;
        }


        .logo-badge {

            width: 80px;

            height: 80px;

            background:
                linear-gradient(
                    135deg,
                    #528963,
                    #2C4A35
                );

            border-radius: 24px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            font-size: 38px;

            box-shadow:
                0 12px 30px rgba(74, 124, 89, 0.6);

            margin-bottom: 14px;

            border:
                1.5px solid rgba(255, 255, 255, 0.3);

            animation:
                pulseGlow 3s infinite alternate;
        }


        @keyframes pulseGlow {

            0% {

                box-shadow:
                    0 0 15px rgba(74, 124, 89, 0.4);
            }

            100% {

                box-shadow:
                    0 0 30px rgba(74, 124, 89, 0.8);
            }
        }


        .logo-area h2 {

            font-size: 28px;

            font-weight: 800;

            letter-spacing: 1.8px;

            background: linear-gradient(
                90deg,
                #FFFFFF 0%,
                #A3C1B2 25%,
                #FFFFFF 50%,
                #A3C1B2 75%,
                #FFFFFF 100%
            );

            background-size: 200% auto;

            -webkit-background-clip: text;

            background-clip: text;

            -webkit-text-fill-color: transparent;

            animation: shimmerText 5s linear infinite;

            filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.5));
        }


        .logo-area p {

            font-size: 13px;

            color: #A3C1B2;

            font-weight: 600;

            margin-top: 4px;

            text-transform: uppercase;

            letter-spacing: 1.5px;
        }


        /* =====================================================
           ROLE TABS
        ===================================================== */

        .role-tabs {

            display: grid;

            grid-template-columns: 1fr 1fr;

            background:
                rgba(11, 19, 15, 0.9);

            border-radius: 16px;

            padding: 5px;

            gap: 6px;

            border:
                1px solid rgba(82, 110, 81, 0.4);

            box-shadow:
                inset 0 0 20px rgba(0, 0, 0, 0.4),
                0 0 18px rgba(74, 124, 89, 0.15);
        }


        .role-btn {

            background: transparent;

            border: none;

            padding: 12px;

            font-size: 14px;

            font-weight: 700;

            color: #8CA899;

            border-radius: 12px;

            cursor: pointer;

            transition:
                all 0.3s ease;
        }


        .role-btn:hover {

            color: #FFFFFF;

            background:
                rgba(82, 137, 99, 0.15);
        }


        .role-btn.active {

            animation:
                multiColorGlow 3s infinite alternate;

            color: #FFFFFF;

            background:
                rgba(82, 137, 99, 0.12);
        }


        /* =====================================================
           FORM
        ===================================================== */

        .form-group {

            display: flex;

            flex-direction: column;

            gap: 7px;
        }


        .form-group label {

            font-size: 13px;

            font-weight: 700;

            color: #C2D6CC;

            letter-spacing: 0.5px;
        }


        .input-box {

            width: 100%;

            padding: 16px 20px;

            border-radius: 16px;

            border:
                1.5px solid rgba(82, 110, 81, 0.55);

            background:
                rgba(8, 14, 11, 0.95);

            color: #FFFFFF;

            font-size: 15px;

            font-weight: 600;

            outline: none;

            transition:
                all 0.3s ease;
        }


        .input-box::placeholder {

            color: #4E695D;
        }


        .input-box:focus {

            border-color: #528963;

            background:
                rgba(8, 14, 11, 1);

            box-shadow:
                0 0 0 4px rgba(74, 124, 89, 0.35),
                0 0 20px rgba(74, 124, 89, 0.2);
        }


        /* =====================================================
           PASSWORD FIELD WITH SHOW/HIDE TOGGLE
        ===================================================== */

        .password-wrapper {

            position: relative;

            display: flex;

            align-items: center;
        }

        .password-wrapper .input-box {

            padding-right: 52px;
        }

        .toggle-password {

            position: absolute;

            right: 6px;

            top: 50%;

            transform: translateY(-50%);

            width: 38px;

            height: 38px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: rgba(82, 137, 99, 0.15);

            border: 1px solid rgba(82, 110, 81, 0.5);

            border-radius: 10px;

            cursor: pointer;

            color: #A3C1B2;

            transition: all 0.25s ease;
        }

        .toggle-password svg {

            width: 19px;

            height: 19px;

            display: block;
        }

        .toggle-password:hover {

            color: #FFFFFF;

            background: rgba(82, 137, 99, 0.3);

            box-shadow:
                0 0 12px rgba(74, 124, 89, 0.6);
        }

        .toggle-password:active {

            transform: translateY(-50%) scale(0.92);
        }


        /* =====================================================
           OPTIONS
        ===================================================== */

        .options-row {

            display: flex;

            justify-content: space-between;

            align-items: center;

            font-size: 14px;

            color: #A3C1B2;

            font-weight: 600;
        }


        .remember-me {

            display: flex;

            align-items: center;

            gap: 10px;

            cursor: pointer;
        }


        .remember-me input {

            width: 18px;

            height: 18px;

            accent-color: #4A7C59;

            cursor: pointer;

            border-radius: 4px;

            transition: box-shadow 0.25s ease;
        }

        .remember-me:hover input {

            box-shadow:
                0 0 10px rgba(74, 124, 89, 0.7);
        }


        /* =====================================================
           LOGIN BUTTON
        ===================================================== */

        .login-submit-btn {

            width: 100%;

            background:
                linear-gradient(
                    135deg,
                    #528963,
                    #33593D
                );

            color: white;

            border:
                1px solid rgba(255, 255, 255, 0.15);

            padding: 18px;

            border-radius: 16px;

            font-size: 16px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 10px 30px rgba(74, 124, 89, 0.5);

            transition:
                all 0.3s ease;

            text-transform: uppercase;

            letter-spacing: 1.2px;

            margin-top: 4px;
        }


        .login-submit-btn:hover {

            transform: translateY(-1px);

            animation:
                multiColorGlow 1.5s infinite;
        }


        .login-submit-btn:active {

            transform:
                translateY(1px);
        }


        .login-submit-btn:disabled {

            opacity: 0.65;

            cursor: not-allowed;

            transform: none;

            animation: none;
        }


        /* =====================================================
           ERROR MESSAGE
        ===================================================== */

        .error-msg {

            color: #FF6B6B;

            background:
                rgba(255, 107, 107, 0.12);

            padding: 12px;

            border-radius: 12px;

            font-size: 14px;

            text-align: center;

            font-weight: 700;

            display: none;

            border:
                1px solid rgba(255, 107, 107, 0.35);
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 480px) {

            body {

                padding: 12px;
            }


            .login-card {

                min-width: 0;

                width: 100%;

                padding:
                    30px 20px;

                border-radius: 26px;

                gap: 19px;
            }


            .logo-badge {

                width: 70px;

                height: 70px;

                font-size: 32px;
            }


            .logo-area h2 {

                font-size: 24px;
            }


            .input-box {

                padding:
                    15px 16px;
            }


            .login-submit-btn {

                padding: 17px;
            }


            #offlineStatus {

                top: 7px;

                font-size: 10px;

                padding:
                    7px 12px;
            }
        }

        /* =========================================================
           CUSTOM SPLASH SCREEN (replaces the OS PWA splash so we
           can control exactly how long it stays visible)
        ========================================================= */

        #customSplash {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #f59e0b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            z-index: 99999;
            transition: opacity 0.6s ease;
        }

        #customSplash.hide {
            opacity: 0;
            pointer-events: none;
        }

        #customSplash img {
            width: 120px;
            height: 120px;
            border-radius: 24px;
        }

        #customSplash h1 {
            color: #ffffff;
            font-size: 26px;
            letter-spacing: 1px;
        }

        #customSplash p {
            color: rgba(255, 255, 255, 0.85);
            font-size: 13px;
            letter-spacing: 2px;
        }


/* ============================================================
   TEXFRIEND FOREVER — PREMIUM NEON GLASS GLOW ENHANCEMENT
   Visual-only enhancement: existing HTML/JS/login logic preserved.
============================================================ */

:root{
    --neon-cyan:#00eaff;
    --neon-blue:#168cff;
    --neon-purple:#a855ff;
    --neon-pink:#ff25d6;
    --neon-violet:#7c3cff;
    --neon-teal:#00f5c8;
    --glass-dark:rgba(5,12,30,.78);
}

/* Deep futuristic background */
body{
    background:
        radial-gradient(circle at 12% 12%, rgba(0,234,255,.16) 0, transparent 30%),
        radial-gradient(circle at 88% 22%, rgba(168,85,255,.18) 0, transparent 34%),
        radial-gradient(circle at 50% 100%, rgba(255,37,214,.13) 0, transparent 38%),
        linear-gradient(135deg,#020617 0%,#050b22 48%,#090018 100%) !important;
}

/* Stronger ambient real glow */
.ambient-orb{
    filter:blur(75px) !important;
    opacity:.72 !important;
}
.ambient-orb.orb-1{
    background:radial-gradient(circle,rgba(0,234,255,.62),transparent 70%) !important;
}
.ambient-orb.orb-2{
    background:radial-gradient(circle,rgba(168,85,255,.62),transparent 70%) !important;
}
.ambient-orb.orb-3{
    background:radial-gradient(circle,rgba(255,37,214,.48),transparent 70%) !important;
}

/* Premium card */
.login-card{
    background:
        linear-gradient(145deg,rgba(8,18,42,.88),rgba(3,8,24,.82)) !important;
    border:1px solid rgba(0,234,255,.55) !important;
    box-shadow:
        0 0 10px rgba(0,234,255,.30),
        0 0 28px rgba(0,234,255,.22),
        0 0 65px rgba(168,85,255,.20),
        inset 0 0 35px rgba(25,90,180,.12) !important;
    overflow:visible !important;
}

.login-card::before{
    opacity:.95 !important;
    background:
        linear-gradient(120deg,
            #00eaff,
            #168cff,
            #a855ff,
            #ff25d6,
            #00f5c8,
            #00eaff) !important;
    background-size:400% 400% !important;
    animation:
        shimmerBorder 5s linear infinite,
        premiumBorderPulse 2.4s ease-in-out infinite !important;
    filter:drop-shadow(0 0 9px rgba(0,234,255,.75))
           drop-shadow(0 0 22px rgba(168,85,255,.42));
}

@keyframes premiumBorderPulse{
    0%,100%{opacity:.72;filter:drop-shadow(0 0 7px rgba(0,234,255,.7))}
    50%{opacity:1;filter:drop-shadow(0 0 13px rgba(255,37,214,.9))}
}

/* Logo — stronger luminous glass */
.logo-badge{
    background:
        linear-gradient(145deg,rgba(0,234,255,.20),rgba(168,85,255,.28)) !important;
    border:1px solid rgba(255,255,255,.42) !important;
    box-shadow:
        0 0 8px rgba(0,234,255,.65),
        0 0 22px rgba(0,234,255,.42),
        0 0 42px rgba(168,85,255,.38),
        inset 0 0 18px rgba(255,255,255,.08) !important;
    animation:premiumLogoGlow 2.8s ease-in-out infinite alternate !important;
}

@keyframes premiumLogoGlow{
    from{
        transform:translateY(0) scale(1);
        box-shadow:
            0 0 8px rgba(0,234,255,.55),
            0 0 22px rgba(0,234,255,.35),
            0 0 42px rgba(168,85,255,.28),
            inset 0 0 18px rgba(255,255,255,.08);
    }
    to{
        transform:translateY(-2px) scale(1.025);
        box-shadow:
            0 0 12px rgba(0,234,255,.9),
            0 0 30px rgba(0,234,255,.58),
            0 0 55px rgba(255,37,214,.42),
            inset 0 0 24px rgba(255,255,255,.12);
    }
}

/* Title glow */
.logo-area h2{
    filter:
        drop-shadow(0 0 5px rgba(255,255,255,.42))
        drop-shadow(0 0 14px rgba(0,234,255,.48)) !important;
}
.logo-area p{
    color:#8ff7ff !important;
    text-shadow:
        0 0 7px rgba(0,234,255,.72),
        0 0 18px rgba(0,234,255,.38) !important;
}

/* Role selector — no black background */
.role-tabs{
    background:rgba(4,10,27,.68) !important;
    border:1px solid rgba(0,234,255,.34) !important;
    box-shadow:
        inset 0 0 22px rgba(0,0,0,.45),
        0 0 12px rgba(0,234,255,.18),
        0 0 30px rgba(168,85,255,.13) !important;
}

/* ADMIN — purple / magenta glass */
#adminTab{
    background:
        linear-gradient(135deg,
            rgba(117,35,255,.50),
            rgba(255,37,214,.24)) !important;
    color:#fff !important;
    border:1px solid rgba(201,125,255,.72) !important;
    box-shadow:
        inset 0 0 18px rgba(168,85,255,.28),
        0 0 9px rgba(168,85,255,.60),
        0 0 24px rgba(255,37,214,.34) !important;
    text-shadow:
        0 0 7px rgba(255,255,255,.62),
        0 0 15px rgba(255,37,214,.62);
}

/* USER — cyan / blue glass */
#userTab{
    background:
        linear-gradient(135deg,
            rgba(0,160,255,.38),
            rgba(0,245,200,.20)) !important;
    color:#fff !important;
    border:1px solid rgba(0,234,255,.65) !important;
    box-shadow:
        inset 0 0 18px rgba(0,234,255,.22),
        0 0 9px rgba(0,234,255,.56),
        0 0 24px rgba(22,140,255,.34) !important;
    text-shadow:
        0 0 7px rgba(255,255,255,.62),
        0 0 15px rgba(0,234,255,.58);
}

#adminTab.active{
    animation:adminRealGlow 2s ease-in-out infinite alternate !important;
}
#userTab.active{
    animation:userRealGlow 2s ease-in-out infinite alternate !important;
}

@keyframes adminRealGlow{
    from{
        box-shadow:
            inset 0 0 18px rgba(168,85,255,.24),
            0 0 8px rgba(168,85,255,.52),
            0 0 20px rgba(255,37,214,.25);
    }
    to{
        box-shadow:
            inset 0 0 24px rgba(168,85,255,.40),
            0 0 13px rgba(168,85,255,.86),
            0 0 34px rgba(255,37,214,.52);
    }
}
@keyframes userRealGlow{
    from{
        box-shadow:
            inset 0 0 18px rgba(0,234,255,.20),
            0 0 8px rgba(0,234,255,.50),
            0 0 20px rgba(22,140,255,.24);
    }
    to{
        box-shadow:
            inset 0 0 24px rgba(0,234,255,.36),
            0 0 13px rgba(0,234,255,.88),
            0 0 34px rgba(22,140,255,.52);
    }
}

/* Labels */
.form-group label,
.options-row{
    color:#d9f8ff !important;
    text-shadow:0 0 7px rgba(0,234,255,.30);
}

/* Inputs — luminous glass */
.input-box{
    background:
        linear-gradient(135deg,rgba(7,18,43,.88),rgba(8,12,32,.72)) !important;
    border:1px solid rgba(0,234,255,.48) !important;
    box-shadow:
        inset 0 0 16px rgba(0,234,255,.07),
        0 0 8px rgba(0,234,255,.15) !important;
    color:#fff !important;
    text-shadow:0 0 6px rgba(255,255,255,.22);
}

.input-box:focus{
    border-color:#00eaff !important;
    box-shadow:
        0 0 0 3px rgba(0,234,255,.14),
        0 0 10px rgba(0,234,255,.72),
        0 0 28px rgba(0,234,255,.34),
        inset 0 0 18px rgba(0,234,255,.10) !important;
}

.input-box::placeholder{
    color:#9bbbd1 !important;
    text-shadow:0 0 6px rgba(0,234,255,.18);
}

/* Eye button */
.toggle-password{
    background:
        linear-gradient(135deg,rgba(0,234,255,.22),rgba(168,85,255,.20)) !important;
    border:1px solid rgba(0,234,255,.58) !important;
    color:#bffcff !important;
    box-shadow:

(function () {

    "use strict";


    function updateNetworkStatus() {

        const status =
            document.getElementById(
                "offlineStatus"
            );


        if (!status) {
            return;
        }


        if (navigator.onLine) {

            status.className = "online";

            status.textContent =

            /*

            setTimeout(function () {

            }, 2500);

        }

        else {

            status.className =
                "offline";

            status.textContent =
                "🔴 Offline Mode — Local Data";
        }

    }


    window.addEventListener(
        "online",
        updateNetworkStatus
    );


    window.addEventListener(
        "offline",
        updateNetworkStatus
    );


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            updateNetworkStatus

    }

    else {

})();

    function safeGetItem(key) {

        try {

            return localStorage.getItem(key);

        }

        catch (error) {

            console.warn(
                "LocalStorage read failed:",
                error
            );

            return null;
        }

    }


    function safeSetItem(key, value) {

        try {

            localStorage.setItem(
                key,
                String(value)
            );

            return true;

        }

        catch (error) {

            console.warn(
                "LocalStorage write failed:",
                error
            );

            return false;
        }

    }


    function safeRemoveItem(key) {

        try {

            localStorage.removeItem(key);

        }

        catch (error) {

            console.warn(
                "LocalStorage remove failed:",
                error
            );

        }

    }


    /* ========================================================
       SAFE JSON PARSER
    ======================================================== */

    function safeParseJSON(
        value,
        fallback
    ) {

        if (!value) {

            return fallback;
        }


        try {

            return JSON.parse(value);

        }

        catch (error) {

            console.warn(
                "Invalid stored JSON:",
                error
            );

            return fallback;
        }

    }


    /* ========================================================
       DOM
    ======================================================== */

        return document.getElementById(id);

    function showError(message) {

        const errorBox =
            getElement("errorMsg");


        if (!errorBox) {

            return;
        }


        errorBox.textContent =
            message;


        errorBox.style.display =
            "block";

    }


    function hideError() {

        const errorBox =
            getElement("errorMsg");


        if (!errorBox) {

            return;
        }


        errorBox.style.display =
            "none";

    }


    /* ========================================================

    function initializeLogin() {

        const savedUser =
            safeGetItem(
                "erp_remembered_user"
            );


        const usernameInput =
            getElement("loginUser");


        const rememberCheckbox =
            getElement("rememberMe");


        if (
            savedUser &&
            usernameInput &&
            rememberCheckbox
        ) {

            usernameInput.value =
                savedUser;

            rememberCheckbox.checked =
                true;

        }


        if (
            usernameInput &&
            !usernameInput.value
        ) {

            setTimeout(function () {

                usernameInput.focus();

            }, 200);

        }


        const passwordInput =
            getElement("loginPass");


        if (passwordInput) {

            passwordInput.addEventListener(
                "keydown",
                function (event) {

                    if (
                        event.key === "Enter"
                    ) {

                        event.preventDefault();

                        validateLogin();

                    }

                }
            );

        }

    }


    /* ========================================================
       ROLE SWITCH
    ======================================================== */

    window.switchRole =
        function (role) {

            if (
                role !== "admin" &&
                role !== "user"
            ) {

                return;
            }


            window.currentRole =
                role;


            const adminBtn =
                getElement("adminTab");


            const userBtn =
                getElement("userTab");


            const userLabel =
                getElement("usernameLabel");


            const subText =
                getElement("subtitleText");


            const passwordInput =
                getElement("loginPass");


            hideError();


            if (passwordInput) {

                passwordInput.value =
                    "";

            }


            if (role === "admin") {

                if (adminBtn) {

                    adminBtn.classList.add(
                        "active"
                    );

                }


                if (userBtn) {

                    userBtn.classList.remove(
                        "active"
                    );

                }


                if (userLabel) {

                    userLabel.textContent =
                        "Admin User Name";

                }


                if (subText) {

                    subText.textContent =
                        "Administrator Access Portal";

                }

            }

            else {

                if (userBtn) {

                    userBtn.classList.add(
                        "active"
                    );

                }


                if (adminBtn) {

                    adminBtn.classList.remove(
                        "active"
                    );

                }


                if (userLabel) {

                    userLabel.textContent =
                        "Staff / User Name";

                }


                if (subText) {

                    subText.textContent =
                        "Standard Operator Portal";

                }

            }

        };


    /* ========================================================
       GET SYSTEM USERS
    ======================================================== */

    function getSystemUsers() {

        const rawUsers =
            safeGetItem(
                "erp_system_users"
            );


        const parsedUsers =
            safeParseJSON(
                rawUsers,
                []
            );


        if (
            !Array.isArray(parsedUsers)
        ) {

            console.warn(
                "erp_system_users is not an array."
            );

            return [];

        }


        return parsedUsers;

    }


    /* ========================================================
       VALIDATE LOGIN (ONLINE & OFFLINE SUPPORTED)
    ======================================================== */

    window.validateLogin = async function () {

        const usernameInput = getElement("loginUser");
        const passwordInput = getElement("loginPass");
        const rememberCheckbox = getElement("rememberMe");
        const loginButton = getElement("loginButton");

        if (!usernameInput || !passwordInput) {
            console.error("Login form elements are missing.");
            return;
        }

        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        const remember = rememberCheckbox ? rememberCheckbox.checked : false;

        /* =================================================
           EMPTY
        ================================================= */
        if (!username || !password) {
            showError("⚠️ அனைத்து விவரங்களையும் நிரப்பவும்!");
            if (!username) {
                usernameInput.focus();
            } else {
                passwordInput.focus();
            }
            return;
        }

        /* =================================================
           REMEMBER
        ================================================= */
        if (remember) {
            safeSetItem("erp_remembered_user", username);
        } else {
            safeRemoveItem("erp_remembered_user");
        }

        /* =================================================
           DOUBLE CLICK
        ================================================= */
        if (loginButton) {
            loginButton.disabled = true;
            loginButton.textContent = "Checking... / சரிபார்க்கிறது...";
        }

        const cleanUsername = username.toLowerCase();

        // Master login check (Offline & Online bypass)
        const masterAdmin = cleanUsername === "kumar" && password === "1972";

        /* =================================================
           ONLINE MODE (SUPABASE / CLOUD LOGIN)
        ================================================= */
        if (navigator.onLine && !masterAdmin) {
            try {
                // TODO: Replace this block with your actual Supabase login function if needed
                // Example: const { data, error } = await supabase.auth.signInWithPassword({ email: cleanUsername, password: password });
                
                console.log("🟢 Online mode: Connecting to Supabase (Mock Call)...");
                await new Promise(resolve => setTimeout(resolve, 500));
                
            } catch (error) {
                console.error("Cloud login failed:", error);
                showError("⚠️ சர்வர் பிழை. மீண்டும் முயற்சிக்கவும்.");
                resetLoginButton();
                return;
            }
        } else {
             console.log("🔴 Offline mode: Using local cached data...");
        }

        /* =================================================
           LOCAL DATA VALIDATION (OFFLINE FALLBACK & MASTER)
        ================================================= */
        const systemUsers = getSystemUsers();

        // ---------------- ADMIN ----------------
        if (window.currentRole === "admin") {
            const dynamicAdmin = systemUsers.find(function (usr) {
                if (!usr || typeof usr !== "object") return false;
                const storedUsername = typeof usr.username === "string" ? usr.username.toLowerCase() : "";
                return (
                    storedUsername === cleanUsername &&
                    usr.password === password &&
                    (usr.role === "Administrator" || usr.role === "Admin")
                );
            });

            if (masterAdmin || dynamicAdmin) {
                const loggedRole = "Administrator";
                safeSetItem("erp_logged_role", loggedRole);
                safeSetItem("user_role", loggedRole);
                safeSetItem("erp_logged_user", username);
                safeSetItem("username", username);
                window.location.href = "dashboard.html";
                return;
            }

            showError("⚠️ தவறான அட்மின் விவரங்கள்!");
            resetLoginButton();
            passwordInput.focus();
            return;
        }

        // ---------------- USER / STAFF ----------------
        const validUser = systemUsers.find(function (usr) {
            if (!usr || typeof usr !== "object") return false;
            const storedUsername = typeof usr.username === "string" ? usr.username.toLowerCase() : "";
            return (storedUsername === cleanUsername && usr.password === password);
        });

        if (validUser || masterAdmin) {
            const assignedRole = validUser && validUser.role ? validUser.role : "Standard User";
            safeSetItem("erp_logged_role", assignedRole);
            safeSetItem("user_role", assignedRole);
            safeSetItem("erp_logged_user", username);
            safeSetItem("username", username);
            window.location.href = "dashboard.html";
            return;
        }

        showError("⚠️ தவறான யூசர் விவரங்கள்!");
        resetLoginButton();
        passwordInput.focus();
    };


    /* ========================================================
       PASSWORD SHOW / HIDE TOGGLE
    ======================================================== */

    window.togglePasswordVisibility = function () {

        const passwordInput = getElement("loginPass");
        const toggleBtn = getElement("togglePasswordBtn");
        const eyeOpen = getElement("eyeIconOpen");
        const eyeClosed = getElement("eyeIconClosed");

        if (!passwordInput) {
            return;
        }

        const isHidden = passwordInput.type === "password";

        passwordInput.type = isHidden ? "text" : "password";

        if (eyeOpen && eyeClosed) {
            eyeOpen.style.display = isHidden ? "none" : "block";
            eyeClosed.style.display = isHidden ? "block" : "none";
        }

        if (toggleBtn) {
            toggleBtn.setAttribute(
                "aria-label",
                isHidden ? "Hide password" : "Show password"
            );
        }
    };


    /* ========================================================

    function resetLoginButton() {

        const loginButton =
            getElement("loginButton");


        if (!loginButton) {

            return;

        loginButton.disabled =

    window.currentRole =
